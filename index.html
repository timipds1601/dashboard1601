<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard 1601 - Pemetaan Usaha</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Leaflet CSS untuk peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Dashboard 1601</h2>
            </div>
            <nav class="nav-menu">
                <div class="nav-item active" data-menu="peta-usaha">
                    <i class="fas fa-map-marked-alt"></i>
                    <span>Peta Usaha</span>
                </div>
                <div class="nav-item" data-menu="rekap-dashboard">
                    <i class="fas fa-chart-bar"></i>
                    <span>Rekap Dashboard</span>
                </div>
                <div class="nav-item" data-menu="statistik">
                    <i class="fas fa-chart-line"></i>
                    <span>Statistik Usaha</span>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h1 id="page-title">Peta Sebaran Usaha</h1>
            </div>
            <div id="content-area">
                <!-- Konten akan dimuat di sini -->
                <div class="loading">Memuat data...</div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="app.js"></script>
</body>
</html>
