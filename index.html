<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Sensus Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
</head>
<body>
    <!-- LEFT NAVIGATION -->
    <div class="left-nav">
        <div class="nav-header">
            <h2><i class="fas fa-chart-line"></i> Dashboard</h2>
            <p>Monitoring Usaha</p>
        </div>
        <nav class="nav-menu">
            <div class="nav-item active" data-menu="peta">
                <i class="fas fa-map-marked-alt"></i>
                <span>Peta Sebaran Usaha</span>
            </div>
            <div class="nav-item" data-menu="rekap">
                <i class="fas fa-chart-bar"></i>
                <span>Rekap Dashboard</span>
            </div>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <!-- KONTEN PETA -->
        <div id="petaContent" class="content-panel active">
            <div class="panel-header">
                <h3><i class="fas fa-map-marked-alt"></i> Peta Sebaran Usaha</h3>
                <p>Visualisasi lokasi usaha pada peta</p>
            </div>
            <div class="panel-body">
                <div class="map-sidebar">
                    <div class="search-section">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Cari nama usaha...">
                        </div>
                        <div class="search-box">
                            <i class="fas fa-location-dot"></i>
                            <input list="idsls-list" id="searchIdsls" placeholder="Cari IDSLS...">
                            <datalist id="idsls-list"></datalist>
                        </div>
                        <div class="filter-group">
                            <label><i class="fas fa-filter"></i> Filter Kategori:</label>
                            <select id="filterKategori">
                                <option value="Semua">-- Semua Kategori --</option>
                            </select>
                        </div>
                    </div>
                    <div class="data-list-section">
                        <div class="section-title">
                            <i class="fas fa-list"></i> Daftar Usaha
                            <span id="totalUsahaCount">0</span>
                        </div>
                        <div id="dataList" class="data-list"></div>
                    </div>
                </div>
                <div class="map-container">
                    <div id="map"></div>
                </div>
            </div>
        </div>

        <!-- KONTEN REKAP DASHBOARD -->
        <div id="rekapContent" class="content-panel">
            <div class="panel-header">
                <h3><i class="fas fa-chart-bar"></i> Rekap Total Usaha per SLS</h3>
                <p>Data jumlah usaha berdasarkan wilayah SLS</p>
            </div>
            <div class="panel-body-rekap">
                <div class="rekap-controls">
                    <div class="search-box-rekap">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchRekap" placeholder="Cari IDSLS, Nama SLS, Kecamatan, atau Desa...">
                    </div>
                    <div class="export-buttons">
                        <button id="exportExcel" class="btn-excel">
                            <i class="fas fa-file-excel"></i> Export Excel
                        </button>
                        <button id="exportPDF" class="btn-pdf">
                            <i class="fas fa-file-pdf"></i> Export PDF
                        </button>
                    </div>
                </div>
                <div class="rekap-stats" id="rekapStats">
                    <div class="stat-card">
                        <i class="fas fa-building"></i>
                        <div class="stat-info">
                            <span class="stat-label">Total SLS</span>
                            <span class="stat-value" id="totalSLS">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-store"></i>
                        <div class="stat-info">
                            <span class="stat-label">Total Usaha</span>
                            <span class="stat-value" id="totalUsahaAll">0</span>
                        </div>
                    </div>
                </div>
                <div id="rekapTableContainer" class="rekap-table-container">
                    <div class="loading-rekap">
                        <i class="fas fa-spinner fa-spin"></i> Memuat data...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
