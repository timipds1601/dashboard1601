<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Sensus Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>-Dashboard Monitoring Usaha-</h2>
            <!-- Menu Navigasi -->
            <div class="nav-menu">
                <div class="nav-item active" data-menu="peta">
                    <i class="fas fa-map-marked-alt"></i>
                    <span>Peta Sebaran Usaha</span>
                </div>
                <div class="nav-item" data-menu="rekap">
                    <i class="fas fa-chart-bar"></i>
                    <span>Rekap Dashboard</span>
                </div>
            </div>
        </div>
        
        <!-- Konten Peta (default) -->
        <div id="petaContent" class="content-panel">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari nama usaha..." style="margin-bottom: 10px; width: 90%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <input list="idsls-list" id="searchIdsls" placeholder="Ketik/Cari IDSLS..." style="width: 90%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <datalist id="idsls-list"></datalist>
            </div>
            <div class="control-group">
                <label>Filter Kategori:</label>
                <select id="filterKategori">
                    <option value="Semua">-- Semua Kategori --</option>
                </select>
            </div>
            <div id="dataList"></div>
        </div>
        
        <!-- Konten Rekap Dashboard (hidden default) -->
        <div id="rekapContent" class="content-panel" style="display: none;">
            <div class="rekap-controls">
                <div class="search-box-rekap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchRekap" placeholder="Cari IDSLS atau Nama SLS...">
                </div>
                <div class="export-buttons">
                    <button id="exportExcel" class="btn-excel">
                        <i class="fas fa-file-excel"></i> Excel
                    </button>
                    <button id="exportPDF" class="btn-pdf">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                </div>
            </div>
            <div id="rekapTableContainer">
                <div class="loading-rekap">Memuat data...</div>
            </div>
        </div>
    </div>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
